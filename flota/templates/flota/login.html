{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            width: 380px;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,.25);
        }

        .logo {
            display: block;
            max-width: 170px;
            margin: 0 auto 20px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-card">

    <img
        src="{% static 'img/logo_guinez.png' %}"
        class="logo"
    >

    <h1>Módulo de Vehículos</h1>

    <p>Ingrese sus credenciales para continuar.</p>

    {% if form.errors %}
        <div class="error">
            Usuario o contraseña incorrectos.
        </div>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label>Usuario</label>
        {{ form.username }}

        <label>Contraseña</label>
        {{ form.password }}

        <button type="submit">
            Iniciar sesión
        </button>

    </form>

</div>

</body>
</html>
